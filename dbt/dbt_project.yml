name: fraud_dbt
version: 1.0.0
config-version: 2

profile: fraud_dbt

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  "dbt_date:time_zone": "UTC"

dispatch:
  - macro_namespace: dbt_date
    search_order: ["fraud_dbt", "dbt_date"]

models:
  fraud_dbt:
    staging:
      +materialized: view
    marts:
      +materialized: table
