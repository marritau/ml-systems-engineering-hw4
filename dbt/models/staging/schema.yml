version: 2

models:
  - name: stg_transactions
    description: Очищенные транзакции с типами ClickHouse и производными признаками.
    columns:
      - name: transaction_time
        description: Время транзакции.
        data_tests:
          - not_null
      - name: transaction_date
        description: Дата транзакции.
        data_tests:
          - not_null
      - name: amount
        description: Сумма транзакции.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0.01
      - name: amount_bucket
        description: Сегмент суммы транзакции.
        data_tests:
          - accepted_values:
              values: [low, medium, high, very_high]
      - name: fraud_flag
        description: Признак фрода из исходного набора данных.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
